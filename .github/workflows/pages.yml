name: Deploy docs site to GitHub Pages

# 构建后部署（ADR 2026-11-16-docs-site-pipeline D4）：
#   npm ci → 类型检查 → 构建（--base /nao-fleet/）→ 卡一致性 / 零外链 → 上传 dist → 部署
# 线上地址：https://nathan3303.github.io/nao-fleet/（项目页子路径；base 只在这里传，
# apps/document/.vitepress/config.mts 保持 '/'，否则 dev / preview 也要带前缀）
#
# 失败必须红：无 continue-on-error；build job 内任一 step 失败即不产出产物，
# deploy job needs: build ⇒ 失败的提交永远不会把旧产物重新发上线。
#
# 触发两面：`pull_request` 只跑 build job 的三道站点检查（合并前就能红），
# Pages 相关步骤（configure-pages / upload / deploy）gate 到主干 push，PR 一律不部署。

on:
  push:
    branches: [main]
    paths:
      # 站点本身（内容 / 组件 / 配置 / 脚本 / 依赖锁定）
      - 'apps/document/**'
      # 角色卡原文与角色清单：构建期注入的来源（不覆盖 = 改卡后线上静默过期）
      - '.agents/prompts/**'
      - '.agents/roles.yaml'
      # 插件页的比对源：产物不随它变，但「页面 ↔ PI_PLUGINS 漂移」的源头就是它
      - 'bin/nao-skill.js'
      - '.github/workflows/pages.yml'
  pull_request:
    # 与 push 逐项一致（不用 YAML 锚点，避免对解析器特性的依赖；一致性由结构断言守）
    paths:
      - 'apps/document/**'
      - '.agents/prompts/**'
      - '.agents/roles.yaml'
      # 插件页的比对源：产物不随它变，但「页面 ↔ PI_PLUGINS 漂移」的源头就是它
      - 'bin/nao-skill.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 最小权限：读仓库内容（checkout）+ 发布 Pages（OIDC 部署令牌）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一次 Pages 发布；不取消进行中的生产部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        # Pages API 只在要部署的触发上碰（PR 来自 fork 时 pages 权限会被降级，跑它只会制造无关红）
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v5

      # 版本单一事实 = apps/document/.nvmrc（与本地 nvm 同源）
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/document/.nvmrc
          # 只缓存 npm 下载缓存，不缓存 node_modules（缓存 install 产物会静默吞掉依赖变更）
          cache: npm
          cache-dependency-path: apps/document/package-lock.json

      # apps/document 是独立私有包（ADR D1）：只装站点依赖，不触碰根发布面
      - name: Install site dependencies
        run: npm ci --prefix apps/document

      - name: Type check
        run: npm --prefix apps/document run check:types

      # 图标守卫自检（T591）：4 个正负控夹具，证明守卫在 prefix 不一致 / 文件缺失 / 空扫时都会红
      - name: Check icon guard self-test
        run: npm --prefix apps/document run check:icons

      # 线上子路径部署：base 由 CLI 传入，构建失败即红
      - name: Build
        run: npm --prefix apps/document run build -- --base /nao-fleet/

      # 以下两项读 apps/document/.vitepress/dist，必须在 Build 之后
      - name: Check role cards (AC3)
        run: npm --prefix apps/document run check:cards

      - name: Check external links (AC7)
        run: npm --prefix apps/document run check:links

      # 读 dist/plugins.html + bin/nao-skill.js：同样必须在 Build 之后
      - name: Check plugins vs PI_PLUGINS (AC4)
        run: npm --prefix apps/document run check:plugins

      - name: Upload Pages artifact
        # 只在主干 push / 手动 dispatch 上传；PR 事件永不产出 Pages 产物
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/document/.vitepress/dist

  deploy:
    needs: build
    # 同一道主干闸：PR 只跑检查，不部署（旧产物也永不回传）
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
